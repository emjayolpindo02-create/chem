<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="flask-liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners for app icon -->
  <rect width="512" height="512" rx="104" fill="url(#bg-grad)" />
  <rect width="496" height="496" x="8" y="8" rx="96" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Orbital rings for gas particles & atoms -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#38bdf8" stroke-dasharray="8 6" stroke-width="3" stroke-opacity="0.4" transform="rotate(-30 256 256)" />
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#a855f7" stroke-dasharray="8 6" stroke-width="3" stroke-opacity="0.35" transform="rotate(30 256 256)" />

  <!-- Gas Particles / Molecules orbiting -->
  <circle cx="120" cy="190" r="10" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="390" cy="320" r="8" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="140" cy="340" r="9" fill="#a855f7" filter="url(#glow)" />
  <circle cx="370" cy="180" r="11" fill="#ec4899" filter="url(#glow)" />
  <circle cx="256" cy="100" r="7" fill="#fbbf24" filter="url(#glow)" />

  <!-- Center Erlenmeyer Flask & Pressure Gauge Symbol -->
  <g filter="url(#glow)">
    <!-- Flask neck -->
    <path d="M226 140 L226 210 L146 350 A30 30 0 0 0 172 390 L340 390 A30 30 0 0 0 366 350 L286 210 L286 140 Z" 
          fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Flask top lip -->
    <rect x="216" y="130" width="80" height="14" rx="7" fill="#38bdf8" />

    <!-- Liquid & Bubbles inside flask -->
    <path d="M174 340 L166 354 A24 24 0 0 0 186 384 L326 384 A24 24 0 0 0 346 354 L338 340 Q256 360 174 340 Z" 
          fill="url(#flask-liquid)" />
    
    <!-- Bubbles rising -->
    <circle cx="230" cy="320" r="7" fill="#ffffff" fill-opacity="0.7" />
    <circle cx="280" cy="300" r="5" fill="#ffffff" fill-opacity="0.7" />
    <circle cx="250" cy="270" r="8" fill="#ffffff" fill-opacity="0.8" />
    <circle cx="264" cy="235" r="6" fill="#ffffff" fill-opacity="0.6" />

    <!-- Measurement tick marks -->
    <line x1="280" y1="330" x2="300" y2="330" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="270" y1="290" x2="286" y2="290" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="260" y1="250" x2="274" y2="250" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <!-- Pressure Gauge / Compass Navigator emblem on neck -->
    <circle cx="256" cy="185" r="22" fill="#0f172a" stroke="#fbbf24" stroke-width="4" />
    <path d="M256 172 L260 185 L256 198 L252 185 Z" fill="#ef4444" />
    <circle cx="256" cy="185" r="3" fill="#fbbf24" />
  </g>

  <!-- Typography subtitle mark inside icon -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#f8fafc" text-anchor="middle" letter-spacing="4">CHEM-NAV</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#38bdf8" text-anchor="middle" letter-spacing="3">GAS LAWS &amp; LAB</text>
</svg>
